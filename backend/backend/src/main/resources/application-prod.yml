spring:
  datasource:
    url: jdbc:mysql://localhost:3306/homecare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.homecare: INFO